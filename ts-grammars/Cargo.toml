[package]
name = "ts-grammars"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Build-time LR parse table compression wrapper for Tree-sitter grammars in anticrumb"

[dependencies]
flate2 = "1"
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"
flate2 = "1"
tar = { version = "0.4", default-features = false }
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-json = "0.24"
tree-sitter-dart = "0.3"

[dev-dependencies]
tree-sitter = "0.25"
