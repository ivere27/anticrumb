name: Installer and publishing checks
on:
  push:
    branches: [master]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'xtask/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [master]
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'xtask/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - run: cargo test --locked -p xtask --test installer_contract --test publish_contract
