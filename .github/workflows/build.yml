name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: arduino/setup-protoc@v3
        with:
          version: '29.3'
      - run: cargo test --locked -p xtask --test publish_contract
      - run: cargo run --locked -q -p xtask -- check
      - run: cargo run --locked -q -p xtask -- test
      - run: cargo run --locked -q -p xtask -- transports --profile dev
      - if: runner.os != 'Windows'
        run: cargo run --locked -q -p xtask -- tui --profile dev
      - run: cargo run --locked -q -p xtask -- package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: anticrumb-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
