// anticrumb's single application API contract.
//
// The same protobuf messages and service paths are used by internal Synurang
// modules (FFI), local daemon IPC, and network gRPC. Transports must
// not add application operations. HTTP provider and MCP projections delegate
// to this contract. API v1 identifies the wire contract, not a product edition.
//
// Ownership:
// - Browser hosts own Chrome, credentials, account catalogs, model turns, and
//   native upload/download artifacts. They never execute workspace tools.
// - Workspace hosts run on the TUI machine and own paths, shell/MCP tools,
//   agent journals, themes/history, and a server-scoped local catalog replica.
// - WorkspaceService is registered only by a local workspace host. A browser
//   daemon does not expose it, even to an authenticated network client.
// - Cross-host file transfer always carries bytes and a basename, never a path.
//
// Authentication and transport security:
// - Every network RPC, including GetInfo and streaming calls, requires the
//   metadata header `authorization: Bearer <token>` before work is accepted.
// - A daemon generates a cryptographically random token at startup unless an
//   explicit token string is supplied. Tokens are never returned by RPC.
// - TLS is mandatory. A self-signed identity is generated by default; clients
//   compare its SHA-256/emoji fingerprint before trusting it on first connect.
// - Local UDS/named pipe clients use OS user identity. Only local IPC exposes
//   workspace execution. Internal FFI has no network authentication.
//
// Recovery:
// - A disconnected RPC does not imply that an accepted turn was cancelled.
// - CreateTurn is idempotent within (server identity, account, idempotency key).
//   Reusing a key with different content fails. Clients must retain that key
//   before sending and reconcile an uncertain outcome before any retry.
// - WatchEvents resumes after a durable sequence and may be reconnected.
//   Cancelling a watcher stops observation only; CancelTurn stops generation.
// - Events are bounded journal records. Generic JSON is limited to extensible
//   event data and tool schemas/arguments; lifecycle and control data are typed.
// - Model/thinking identifiers and options are discovered data, never enums.
//   GetCatalog never accesses the browser. Only RefreshCatalog does discovery.

syntax = "proto3";
package anticrumb.v1;
option java_package = "io.anticrumb.v1";
option java_multiple_files = true;

// Standard gRPC client binding on a same-user local connection. No transport
// preamble or bearer token. Browser selection is explicit and workspace tools
// always execute on the local daemon.
message ConnectClientRequest {
  string protocol = 1;
  RemoteBrowser remote = 2;
  optional uint32 workers = 3;
  optional string pace = 4;
}
message RemoteBrowser {
  string endpoint = 1;
  string token = 2;
  optional string ca_file = 3;
  optional string server_name = 4;
  optional string tls_pin = 5;
}

service PlatformService {
  rpc GetInfo(Empty) returns (HostInfo);
  rpc GetStatus(Empty) returns (HostStatus);
  rpc GetUsage(Empty) returns (Usage);
  rpc PruneCache(PruneRequest) returns (PruneResult);
  // Cache maintenance spans this workspace and its connected browser host.
  // Saved conversations, referenced attachments, and Chrome profiles are retained.
  rpc ManageCache(CacheRequest) returns (CacheReport);
  // Stops admission and requests cancellation of host-owned work.
  rpc Shutdown(Empty) returns (Empty);
}

service ProviderService {
  rpc ListProviders(Empty) returns (ProviderList);
  rpc GetProvider(ProviderRef) returns (ProviderInfo);
  rpc RegisterProvider(RegisterProviderRequest) returns (ProviderInfo);
  rpc UnregisterProvider(ProviderRef) returns (Empty);
}

service AccountService {
  rpc ListAccounts(Empty) returns (AccountList);
  rpc CreateAccount(CreateAccountRequest) returns (Account);
  // Explicitly attaches a running, verified Chrome profile on the daemon host.
  rpc AttachBrowser(AttachBrowserRequest) returns (BrowserStatus);
  // Opens a visible managed profile on the daemon host, never the TUI host.
  rpc OpenLogin(AccountRef) returns (Empty);
  // Switches the managed account browser between headless and visible window mode.
  rpc SetBrowserMode(SetBrowserModeRequest) returns (BrowserStatus);
  rpc PauseAccount(AccountRef) returns (Account);
  // Connectivity/profile diagnostics. Authentication is last-verified evidence.
  rpc GetBrowserStatus(AccountRef) returns (BrowserStatus);
  // Explicit live read of the signed-in account's usage page. Does not submit a
  // model turn, refresh the model catalog, or infer exact quota from local use.
  rpc GetWebUsage(AccountRef) returns (WebUsage);
  // Explicitly clear all web chats in this account, including chats created
  // outside anticrumb. Starts a durable asynchronous job, never auto-repeated.
  rpc ClearWebHistory(AccountRef) returns (WebHistoryCleanupStatus);
  rpc GetWebHistoryCleanup(AccountRef) returns (WebHistoryCleanupStatus);
  // Render an HTTP/HTTPS URL in an isolated temporary browser tab on the Chrome host.
  rpc BrowserFetch(BrowserFetchRequest) returns (BrowserFetchResponse);
  // Stateful interactive Chrome tab control (open, snapshot, click, type, press, select, scroll, wait, close, list).
  rpc BrowserControl(BrowserControlRequest) returns (BrowserControlResponse);
}

service ModelService {
  // Durable account catalog; no TTL or implicit browser activity.
  rpc GetCatalog(AccountRef) returns (ModelCatalog);
  // Serializes with account work, replaces the cache only on complete success,
  // and restores the original model selection. Failure preserves the old cache.
  rpc RefreshCatalog(AccountRef) returns (ModelCatalog);
}

service TurnService {
  rpc CreateTurn(TurnRequest) returns (TurnRef);
  rpc GetTurn(TurnRef) returns (Turn);
  rpc ListTurns(ListTurnsRequest) returns (TurnList);
  rpc CancelTurn(TurnRef) returns (Empty);
  rpc ReadEvents(EventCursor) returns (EventPage);
  // At-least-once observation with a monotonically increasing sequence cursor.
  // Terminal state is journaled before the stream closes. A missing/pruned run
  // is NOT_FOUND, never an empty successful stream.
  rpc WatchEvents(EventCursor) returns (stream Event);
}

service SessionService {
  rpc ListSessions(Empty) returns (SessionList);
  rpc CloseSession(SessionRef) returns (Empty);
  // Permanently delete only this recorded session's web conversation.
  rpc DeleteConversation(SessionRef) returns (Empty);
  rpc RecoverMedia(SessionRef) returns (ArtifactList);
}

service ArtifactService {
  // Bounded to 32 MiB. Uploads are content-addressed and deduplicated within an
  // account/name/MIME/hash tuple. Bytes are staged on the Chrome host and then
  // attached through Gemini's native file picker, never expanded into a prompt.
  rpc PutArtifact(PutArtifactRequest) returns (Artifact);
  rpc GetArtifact(ArtifactRef) returns (ArtifactData);
}

// Local-only service for the coding agent on the TUI machine. This service is
// absent from a browser daemon. Its paths are never forwarded to Browser APIs.
service WorkspaceService {
  // Idempotently binds this local IPC connection to a browser backend. This
  // operation is unavailable on network listeners and internal FFI modules.
  rpc ConnectClient(ConnectClientRequest) returns (HostInfo);
  rpc StartAgent(AgentRequest) returns (AgentRef);
  rpc GetAgent(AgentRef) returns (Agent);
  rpc ListAgents(Empty) returns (AgentList);
  // Delete one finished local record and its events, and queue removal of its
  // recorded web chats. Active records and active dependent turns reject.
  rpc DeleteAgent(AgentRef) returns (Empty);
  rpc CancelAgent(AgentRef) returns (Empty);
  rpc SteerAgent(SteerRequest) returns (Empty);
  rpc ResumeAgent(AgentRef) returns (AgentRef);
  rpc ReadAgentEvents(EventCursor) returns (EventPage);
  rpc QueryKnowledge(KnowledgeQuery) returns (KnowledgeResults);
}

message Empty {}
message ProviderRef { string id = 1; }
message ProviderCapabilities {
  bool browser_auth = 1;
  bool temporary_sessions = 2;
  bool file_uploads = 3;
  bool image_generation = 4;
  bool web_usage = 5;
  bool web_history_cleanup = 6;
  bool native_tools = 7;
}
message ProviderInfo {
  string id = 1;
  string name = 2;
  string version = 3;
  string kind = 4;
  optional string entry_url = 5;
  string default_model = 6;
  string source = 7;
  ProviderCapabilities capabilities = 8;
  // Follow-up agent prompts above this character count are attached as text files.
  // Absent means 2000; zero attaches every nonempty follow-up.
  optional uint32 inline_prompt_chars = 9;
}
message ProviderList { repeated ProviderInfo providers = 1; }
message RegisterProviderRequest {
  string id = 1;
  string name = 2;
  string version = 3;
  string kind = 4;
  optional string entry_url = 5;
  repeated string allowed_origins = 6;
  optional string default_model = 7;
  optional string scripts_dir = 8;
  map<string, string> scripts = 9;
  ProviderCapabilities capabilities = 10;
  repeated string auth_url_substrings = 11;
  repeated string chat_url_prefixes = 12;
  repeated string reusable_path_prefixes = 13;
  optional string usage_url = 14;
  optional string observer_binding = 15;
  bool requires_models_control = 16;
  optional uint32 inline_prompt_chars = 17;
}
message AccountRef { string account_id = 1; }
message WebHistoryCleanupStatus {
  string account_id = 1;
  string state = 2; // idle, pending, running, completed, failed, interrupted
  uint32 deleted = 3;
  string error = 4;
  int64 started_at = 5;
  int64 updated_at = 6;
}
message TurnRef { string id = 1; }
message SessionRef { string id = 1; }
message AgentRef { string id = 1; }

message HostInfo {
  string server_id = 1; // Stable for a host state directory; scopes client caches.
  string version = 2;
  string platform = 3;
  repeated string services = 4; // Fully qualified registered service names.
  uint32 max_artifact_bytes = 5;
  uint32 max_message_bytes = 6;
  string role = 7; // browser or workspace
}
message Account {
  string id = 1;
  string provider = 2;
  string state = 3;
  string profile = 4; // Diagnostic path on the browser host, not a client path.
  optional string subprofile = 5;
  uint32 port = 6;
  bool headless = 7;
}
message AccountList { repeated Account accounts = 1; }
message CreateAccountRequest {
  string id = 1;
  uint32 port = 2; // 0 = auto-assign next free CDP port
  string provider = 3;
}
message AttachBrowserRequest { string account_id = 1; uint32 port = 2; }
message SetBrowserModeRequest { string account_id = 1; bool headless = 2; }
message BrowserStatus {
  string account_id = 1;
  string account_state = 2;
  bool connected = 3;
  string endpoint = 4;
  optional string browser = 5;
  string profile = 6;
  optional bool profile_matches = 7;
  optional bool headless = 8;
  uint64 owned_sessions = 9;
  optional bool last_verified_sign_in = 10;
  optional int64 checked_at = 11; // Unix milliseconds; absent means never checked.
  LoginStatus login = 12;
}
message LoginStatus {
  string state = 1; // waiting, refreshing, ready, failed, or timed_out.
  string error = 2; // Safe diagnostic for an explicitly opened sign-in flow.
}
message WebUsage {
  string account_id = 1;
  string server_id = 2;
  int64 checked_at = 3; // Unix milliseconds of this successful observation.
  optional string plan = 4;
  repeated WebUsageLimit limits = 5;
  string notice = 6; // Explains fields the web account does not expose.
  string updated_label = 7; // The page's own update description, when shown.
  string timezone = 8; // Browser timezone for the page's reset descriptions.
}
message WebUsageLimit {
  string label = 1;
  // Preserve site-provided values and units. Absent does not mean zero.
  optional string used = 2;
  optional string remaining = 3;
  optional string limit = 4;
  optional string reset = 5;
  string status = 6;
  string detail = 7;
  optional double used_percent = 8; // Only when the page explicitly shows it.
}
message BrowserFetchRequest {
  string account_id = 1;
  string url = 2;
  uint32 wait_ms = 3;
  uint32 max_chars = 4;
}
message BrowserFetchResponse {
  string url = 1;
  string title = 2;
  string text = 3;
}
message BrowserControlRequest {
  string account_id = 1;
  string session_id = 2;
  string tab_id = 3;
  uint32 timeout_ms = 4;
  uint32 max_chars = 5;
  uint32 wait_ms = 6; // Optional delay before observing the result, within timeout_ms.
  oneof command {
    Empty tabs = 10;
    BrowserNavigate open = 11;
    Empty use_tab = 12;
    Empty snapshot = 13;
    BrowserNavigate navigate = 14;
    Empty back = 15;
    Empty forward = 16;
    Empty reload = 17;
    BrowserTarget click = 18;
    BrowserTextInput fill = 19;
    BrowserTextInput type = 20;
    BrowserKey press = 21;
    BrowserSelect select = 22;
    BrowserScroll scroll = 23;
    BrowserWait wait = 24;
    Empty close = 25;
    Empty reset = 26;
    BrowserCapture screenshot = 27;
    BrowserPoint click_point = 28;
    BrowserWheel wheel = 29;
  }
}
message BrowserNavigate { string url = 1; }
message BrowserRole { string role = 1; string name = 2; }
message BrowserTarget {
  oneof locator {
    string ref = 1;
    string css = 2;
    string name = 3;
    BrowserRole role = 4;
  }
}
message BrowserTextInput { BrowserTarget target = 1; string text = 2; }
message BrowserKey { string key = 1; BrowserTarget target = 2; repeated string modifiers = 3; }
// Regions use viewport CSS pixels. Points use pixels in the identified screenshot.
message BrowserRegion { double x = 1; double y = 2; double width = 3; double height = 4; }
message BrowserCapture { BrowserRegion region = 1; }
message BrowserPoint { string screenshot_id = 1; double x = 2; double y = 3; }
message BrowserWheel { BrowserPoint point = 1; double delta_x = 2; double delta_y = 3; }
message BrowserScreenshot {
  string id = 1;
  string artifact_id = 2;
  uint32 width = 3;
  uint32 height = 4;
  BrowserRegion region = 5;
  // Internal capture bytes; the RPC host stores them as an artifact and clears this field.
  bytes png = 6;
}
message BrowserSelect { BrowserTarget target = 1; string value = 2; }
message BrowserScroll { int32 x = 1; int32 y = 2; BrowserTarget target = 3; }
message BrowserWait {
  BrowserTarget target = 1;
  enum State { VISIBLE = 0; HIDDEN = 1; }
  State state = 2;
}
message BrowserControlElement {
  string ref_id = 1;
  string tag = 2;
  string role = 3;
  string label = 4;
  string value = 5;
  string href = 6;
  bool disabled = 7;
  optional bool checked = 8;
  repeated BrowserSelectOption options = 9;
}
message BrowserSelectOption { string value = 1; string label = 2; bool selected = 3; }
message BrowserTab {
  string tab_id = 1;
  string url = 2;
  string title = 3;
}
message BrowserSnapshot {
  string tab_id = 1;
  string url = 2;
  string title = 3;
  string text = 4;
  repeated BrowserControlElement elements = 5;
  bool text_truncated = 6;
  bool elements_truncated = 7;
  BrowserScreenshot screenshot = 8;
}
message BrowserControlResponse {
  string session_id = 1;
  string active_tab_id = 2;
  repeated BrowserTab tabs = 3;
  BrowserSnapshot page = 4;
  string message = 5;
}
message ThinkingOption {
  string level = 1;
  string label = 2;
  string sublabel = 3;
  bool selected = 4;
  bool locked = 5;
  optional string rate_limit_reset = 6;
  uint32 index = 7;
}
message ModelOption {
  string mode_id = 1;
  string label = 2;
  string sublabel = 3;
  bool selected = 4;
  bool locked = 5;
  optional string rate_limit_reset = 6;
  uint32 index = 7;
}
message ThinkingOptions { repeated ThinkingOption options = 1; }
message ModelCatalog {
  string account_id = 1;
  string server_id = 2;
  optional int64 checked_at = 3;
  repeated ModelOption models = 4;
  repeated ThinkingOption thinking = 5;
  map<string, ThinkingOptions> model_thinking = 6;
  string provider = 7;
  optional string adapter = 8;
}
message AccountStatus {
  string id = 1;
  string state = 2;
  optional string selected_model = 3;
  ModelCatalog catalog = 4;
  LoginStatus login = 5;
  string provider = 6;
}
message HostStatus {
  string server_id = 1;
  repeated AccountStatus accounts = 2;
  Usage usage = 3;
  repeated ProviderInfo providers = 4;
  // Actual browser connection owned by a workspace host.
  BrowserConnection browser_connection = 5;
  ChatCleanupStatus chat_cleanup = 6;
  // Local daemon process and IPC diagnostics, populated only on local IPC.
  RuntimeStatus runtime = 7;
  uint32 active_agents = 8; // Active agents in the selected workspace store.
}
message RuntimeStatus {
  uint32 pid = 1;
  string version = 2;
  bool automatic = 3;
  string transport = 4; // unix or named_pipe
  string endpoint = 5;
  uint64 uptime_ms = 6;
  uint32 connected_clients = 7; // All IPC connections, including this caller.
  bool stopping = 8;
}
message ChatCleanupStatus {
  uint32 pending = 1;
  uint32 running = 2;
  uint32 failed = 3;
  uint32 completed = 4;
  uint32 unmapped = 5;
  string last_error = 6;
}
message BrowserConnection {
  string transport = 1; // local or grpc
  string endpoint = 2; // Sanitized network origin; empty for local transports.
  string server_id = 3; // Browser peer identity verified when this workspace started.
  bool connected = 4; // A bounded live probe reached that same browser peer.
  string error = 5; // Safe diagnostic, never credentials or raw remote errors.
}
message Usage {
  uint64 queued = 1;
  uint64 running = 2;
  uint64 input_chars = 3;
  uint64 output_chars = 4;
  uint64 completed = 5;
  uint64 submitted_chars = 6;
  uint64 reused_turns = 7;
  optional uint64 input_tokens = 8; // Absent when upstream does not report it.
  optional uint64 output_tokens = 9;
}
message PruneRequest { uint32 days = 1; }
message PruneResult {
  uint64 expired_cache = 1;
  uint64 runs = 2;
  uint64 artifacts = 3;
  uint64 blob_bytes_reclaimed = 4;
}
message CacheRequest {
  uint32 days = 1; // Zero selects the default of seven days.
  bool prune = 2;
  bool dry_run = 3;
}
message CacheStats {
  uint32 retention_days = 1;
  uint64 blob_bytes = 2;
  uint64 temporary_bytes = 3;
  uint64 reclaimable_bytes = 4;
  uint64 reclaimed_bytes = 5;
  uint64 eligible_artifacts = 6;
  uint64 temporary_entries = 7;
  uint64 orphan_blobs = 8;
  uint64 expired_cache = 9;
  int64 last_cleanup = 10;
  bool pruned = 11;
  bool busy = 12;
}
message CacheStoreReport {
  string role = 1;
  string server_id = 2;
  CacheStats stats = 3;
  string error = 4; // Partial failures never imply that both hosts were cleaned.
}
message CacheReport { repeated CacheStoreReport stores = 1; }

message ToolDefinition {
  string kind = 1; // function or custom
  string name = 2;
  string description = 3;
  string parameters_json = 4; // Valid JSON schema; bounded by request limits.
}
message ToolCall {
  string kind = 1;
  string id = 2;
  string name = 3;
  string arguments_json = 4;
}
message ToolResult { string call_id = 1; string content = 2; }
message ContentBlock {
  oneof value {
    string text = 1;
    ToolCall tool_call = 2;
    ToolResult tool_result = 3;
    string artifact_id = 4;
  }
}
message Message { string role = 1; repeated ContentBlock blocks = 2; }
message TurnRequest {
  string account_id = 1;
  optional string session_id = 2;
  repeated Message messages = 3;
  repeated ToolDefinition tools = 4;
  string tool_choice_json = 5;
  bool parallel_tool_calls = 6;
  optional uint64 output_token_hint = 7;
  optional string model = 8;
  optional string thinking = 9;
  string mode = 10; // chat or temporary; temporary is not anonymous guest mode.
  repeated string artifacts = 11;
  uint64 timeout_secs = 12;
  optional string idempotency_key = 13;
  bool generate_image = 14;
  bool keep_session = 15;
  optional string reuse_scope = 16;
}
message TurnResult {
  string session_id = 1;
  string text = 2;
  repeated ToolCall tool_calls = 3;
  repeated string artifacts = 4;
  optional string model = 5;
  uint64 elapsed_ms = 6;
}
message Turn {
  string id = 1;
  string state = 2;
  TurnRequest request = 3;
  optional TurnResult result = 4;
  optional ErrorDetail error = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}
message ListTurnsRequest { uint32 limit = 1; }
message TurnSummary {
  string id = 1;
  string account_id = 2;
  string state = 3;
  uint64 input_chars = 4;
  uint64 output_chars = 5;
  int64 updated_at = 6;
}
message TurnList { repeated TurnSummary turns = 1; }
message EventCursor { string run_id = 1; int64 after = 2; }
message Event {
  int64 sequence = 1;
  string run_id = 2;
  string kind = 3;
  string data_json = 4; // Extensible event payload, not an executable command.
  int64 at = 5;
}
message EventPage { repeated Event events = 1; }
message Session {
  string id = 1;
  string account_id = 2;
  string mode = 3;
  string state = 4;
  optional string model = 5;
  optional string thinking = 6;
  int64 last_used = 7;
  uint64 remote_turns = 8;
}
message SessionList { repeated Session sessions = 1; }
message ArtifactRef { string account_id = 1; string id = 2; }
message PutArtifactRequest {
  string account_id = 1;
  string name = 2; // Basename only; both slash conventions are rejected.
  string mime = 3;
  bytes data = 4;
  string sha256 = 5; // Required; receiver checks before committing a blob.
}
message Artifact {
  string id = 1;
  string scope = 2;
  string hash = 3;
  string mime = 4;
  string name = 5;
  uint64 size = 6;
  string origin = 7;
  int64 created_at = 8;
}
message ArtifactData { Artifact artifact = 1; bytes data = 2; }
message ArtifactList { repeated Artifact artifacts = 1; }

// Wire-compatible with Synurang core.v1.Error's first three fields. The extra
// fields preserve actionable application errors across FFI, IPC, and gRPC.
// Network failures use the corresponding gRPC status and these encoded details.
message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  int32 grpc_code = 3;
  string stage = 4;
  string retry = 5; // never, after_human, after_delay, after_adapter_update, after_reconcile
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  INVALID_REQUEST = 1;
  UNSUPPORTED_CAPABILITY = 2;
  AUTH_REQUIRED = 3;
  VERIFICATION_REQUIRED = 4;
  RATE_LIMITED = 5;
  UI_CONTRACT_CHANGED = 6;
  TRANSPORT_DISCONNECTED = 7;
  SUBMISSION_OUTCOME_UNKNOWN = 8;
  UPLOAD_FAILED = 9;
  MEDIA_DOWNLOAD_FAILED = 10;
  TOOL_PROTOCOL_INVALID = 11;
  WORKSPACE_CONFLICT = 12;
  CANCELLED = 13;
  DEADLINE_EXCEEDED = 14;
  QUEUE_FULL = 15;
  NOT_FOUND = 16;
  STORAGE_FAILURE = 17;
  INTERNAL = 18;
}

message AgentRequest {
  string task = 1;
  string workspace = 2; // Local workspace host path, never a browser host path.
  string account_id = 3;
  optional string model = 4;
  optional string thinking = 5;
  bool temporary = 6;
  bool no_shell = 7;
  uint32 max_steps = 8;
  optional string knowledge = 9;
  optional string mcp_config = 10;
  repeated string artifacts = 11;
  optional string parent_id = 12;
  // Transient client environment for local shell/MCP execution. Never persisted
  // or included in Agent responses. Browser hosts do not expose WorkspaceService.
  map<string, string> environment = 13;
}
message Agent {
  string id = 1;
  string state = 2;
  AgentRequest request = 3;
  optional AgentResult result = 4;
  optional ErrorDetail error = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}
message AgentResult {
  string status = 1;
  string final_response = 2;
  repeated string files_changed = 3;
  repeated AgentStep steps = 4;
  string task = 5;
  bool temp_chat = 6;
  uint64 elapsed_ms = 7;
}
message AgentToolCall { string tool = 1; string args_json = 2; }
message AgentObservation { string tool = 1; bool ok = 2; string output = 3; uint64 elapsed_ms = 4; repeated string artifacts = 5; }
message AgentStep {
  uint32 step = 1;
  string model_response = 2;
  repeated AgentToolCall tool_calls = 3;
  repeated AgentObservation observations = 4;
  repeated string notes = 5;
}
message AgentList { repeated Agent agents = 1; }
message SteerRequest { string id = 1; string message = 2; repeated string artifacts = 3; }
message KnowledgeQuery { string query = 1; optional string source = 2; uint32 limit = 3; }
message KnowledgeExcerpt { string source = 1; string path = 2; uint64 line = 3; string text = 4; string hash = 5; string citation = 6; }
message KnowledgeResults { repeated KnowledgeExcerpt excerpts = 1; }
