[workspace]
members = [".", "ts-grammars", "xtask"]

[package]
name = "anticrumb"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
description = "Cross-platform coding agent and Synurang browser service for Gemini Web"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "anticrumb"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
ctrlc = "3.5.2"
# The level-triggered Unix reader drains paste bursts without another keypress.
# https://github.com/crossterm-rs/crossterm/issues/1142
crossterm = { version = "0.28", features = ["use-dev-tty"] }
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-std", "io-util", "process"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync", "net"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.11"
semver = "1"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
thiserror = "2"
http = "1"
http-body-util = "0.1"
bytes = "1"
hyper = { version = "1", features = ["client", "server", "http1"] }
futures-util = "0.3"
tokio-tungstenite = "0.28"
rmcp = { version = "3.10", default-features = false, features = ["server", "client", "transport-io", "transport-child-process"] }
prost = "0.13.5"
tonic = { version = "0.13", features = ["tls-ring", "tls-native-roots"] }
synurang-host = { git = "https://github.com/ivere27/synurang.git", rev = "53180b484cf7ca07a1e7d6f24e58b8a19a2dcfa8", default-features = false, features = ["module"] }
synurang-call = { git = "https://github.com/ivere27/synurang.git", rev = "53180b484cf7ca07a1e7d6f24e58b8a19a2dcfa8" }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tree-sitter = { version = "0.25", optional = true }
ts-grammars = { path = "ts-grammars", optional = true }
rayon = { version = "1", optional = true }
regex = "1"
ignore = "0.4"

[features]
default = ["tree-sitter"]
tree-sitter = [
    "dep:tree-sitter",
    "dep:rayon",
    "dep:ts-grammars",
]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tonic-build = "0.13"
prost = "0.13.5"
prost-types = "0.13.5"
sha2 = "0.11"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
